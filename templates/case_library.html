<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Case Library — जगदिश्वरम् डिजिटल कार्यालय</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/jdo-logo.svg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #EDE9E4;
      --bg: #0F0D0B;
      --accent: #D4521C;
      --border: #2D2823;
      --subtle: #8A837B;
      --surface: #1C1916;
      --surface-2: #242018;
      --font-head: 'Crimson Pro', Georgia, serif;
      --font-body: 'Inter', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--ink);
      font-size: 13px;
      line-height: 1.5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── HEADER ── */
    .app-header {
      height: 56px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 12px;
      flex-shrink: 0;
      background: var(--bg);
    }
    .header-logo-mark { width: 26px; height: 26px; object-fit: contain; flex-shrink: 0; }
    .brand { font-family: var(--font-head); font-size: 17px; font-weight: 600; white-space: nowrap; }
    .brand-sub { font-size: 10px; color: var(--subtle); }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
    .header-search { position: relative; }
    .header-search input {
      width: 280px; border: 1px solid var(--border); border-radius: 6px;
      padding: 6px 10px 6px 28px; font-size: 12px; font-family: var(--font-body);
      background: var(--surface); color: var(--ink);
    }
    .header-search input:focus { outline: 2px solid var(--accent); outline-offset: 2px; border-color: transparent; }
    .search-icon { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); color: var(--subtle); font-size: 12px; pointer-events: none; }
    .entity-count { font-size: 11px; color: var(--subtle); white-space: nowrap; }
    .entity-count strong { color: var(--accent); }
    .brand-link { text-decoration: none; color: inherit; display: flex; align-items: center; gap: 12px; }
    .site-nav { display: flex; gap: 2px; align-items: center; }
    .nav-pill { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.05em; color: var(--subtle); border: 1px solid transparent; border-radius: 4px; padding: 3px 8px; text-decoration: none; white-space: nowrap; transition: color 0.12s; }
    .nav-pill:hover { color: var(--ink); text-decoration: none; }
    .nav-pill.active { color: var(--accent); border-color: var(--border); background: var(--surface); }
    .btn-rebuild {
      font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.05em;
      color: var(--subtle); border: 1px solid var(--border); border-radius: 4px;
      padding: 3px 8px; background: none; cursor: pointer; white-space: nowrap;
    }
    .btn-rebuild:hover { color: var(--ink); border-color: var(--subtle); }
    .btn-rebuild.loading { opacity: 0.5; cursor: not-allowed; }
    @media (max-width: 560px) { .site-nav { gap: 1px; } .nav-pill { padding: 2px 5px; font-size: 9px; } }

    /* ── TWO PANE ── */
    .two-pane { display: grid; grid-template-columns: 288px 1fr; flex: 1; overflow: hidden; }

    /* ── SIDEBAR ── */
    .sidebar { border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
    .filter-strip {
      padding: 8px 10px; border-bottom: 1px solid var(--border);
      display: flex; gap: 5px; align-items: center; flex-shrink: 0; flex-wrap: wrap;
    }
    .filter-select {
      flex: 1; min-width: 100px; border: 1px solid var(--border); border-radius: 5px;
      padding: 4px 6px; font-size: 11px; font-family: var(--font-body);
      background: var(--surface); color: var(--ink); cursor: pointer;
    }
    .filter-select:focus { outline: 1px solid var(--accent); }
    .tree-scroll { overflow-y: auto; flex: 1; padding: 6px 0; }

    /* ── FLAT LIST (replaces nested tree) ── */
    .flat-list { list-style: none; }
    .list-item {
      display: flex; align-items: flex-start; padding: 7px 8px 7px 10px;
      cursor: pointer; border-left: 3px solid transparent; gap: 6px;
      user-select: none;
    }
    .list-item:hover { background: rgba(212,82,28,0.06); }
    .list-item.selected { background: rgba(212,82,28,0.12); border-left-color: var(--accent); }
    .list-item.hidden { display: none; }
    .list-icon { flex-shrink: 0; font-size: 13px; padding-top: 1px; }
    .list-text { flex: 1; min-width: 0; }
    .list-name {
      font-family: var(--font-head); font-size: 13px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block;
    }
    .list-date { font-size: 10px; color: var(--subtle); margin-top: 1px; }
    .list-badges { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 2px; }
    .list-badge {
      font-size: 9px; font-weight: 600; padding: 0 4px;
      border-radius: 3px; white-space: nowrap;
    }
    .list-badge-auth { background: rgba(212,82,28,0.18); color: var(--accent); }
    .list-badge-custom { background: rgba(138,131,123,0.18); color: var(--subtle); }
    .list-badge-private { background: rgba(239,68,68,0.15); color: #EF4444; }
    .list-badge-nodate { background: rgba(234,179,8,0.12); color: #CA8A04; }
    .list-section-header {
      font-size: 9px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--subtle);
      padding: 10px 12px 4px;
    }

    /* ── FOCUS PANE ── */
    .focus-pane { overflow-y: auto; padding: 32px 40px; background: var(--surface); }
    .focus-empty {
      height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: var(--subtle); gap: 10px;
    }
    .focus-empty .icon { font-size: 36px; opacity: 0.2; }
    .focus-empty p { font-size: 13px; }

    /* Doc header */
    .doc-header { margin-bottom: 28px; }
    .doc-chips { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
    .chip {
      display: inline-flex; align-items: center; padding: 2px 8px;
      border-radius: 4px; font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    .chip-pdf    { background: #2B1800; color: #FCD34D; }
    .chip-folder { background: #0A1A30; color: #93C5FD; }
    .chip-video  { background: #250A16; color: #F9A8D4; }
    .chip-image  { background: #071A0F; color: #6EE7B7; }
    .chip-doc    { background: #0F0D2A; color: #A5B4FC; }
    .chip-private { background: rgba(239,68,68,0.15); color: #EF4444; }
    .doc-title { font-family: var(--font-head); font-size: 22px; font-weight: 600; line-height: 1.3; margin-bottom: 4px; }
    .doc-path { font-size: 11px; color: var(--subtle); font-family: var(--font-mono); margin-bottom: 14px; }
    .btn-open-file {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--ink); color: var(--bg);
      border: none; padding: 8px 16px; border-radius: 7px;
      font-size: 12px; font-family: var(--font-body); font-weight: 500;
      cursor: pointer; text-decoration: none;
    }
    .btn-open-file:hover { background: #D4CEC8; }
    .btn-open-file.disabled { background: #3D3930; color: var(--subtle); cursor: not-allowed; }

    /* Meta blocks */
    .meta-block { margin-bottom: 24px; }
    .meta-title {
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--subtle);
      margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border);
      display: flex; align-items: baseline; gap: 6px;
    }
    .meta-title-note { font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 9px; color: var(--subtle); }
    .meta-grid { display: grid; grid-template-columns: 106px 1fr; gap: 7px 10px; font-size: 12px; }
    .meta-key { color: var(--subtle); align-self: start; padding-top: 1px; }
    .meta-val { color: var(--ink); word-break: break-all; }
    .meta-val.mono { font-family: var(--font-mono); font-size: 11px; }
    .description-text { font-size: 13px; color: var(--ink); line-height: 1.6; }
    .description-empty { font-size: 12px; color: var(--subtle); font-style: italic; }

    /* Authority code section */
    .authority-code-area { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .auth-chip {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(212,82,28,0.14); color: var(--accent);
      padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: 500;
    }
    .auth-chip .auth-name { color: var(--subtle); font-weight: 400; }
    .auth-select-wrap select {
      border: 1px solid var(--border); border-radius: 5px; padding: 4px 8px;
      font-size: 11px; font-family: var(--font-body);
      background: var(--surface-2); color: var(--ink); cursor: pointer;
    }
    .auth-select-wrap select:focus { outline: 1px solid var(--accent); }

    /* Custom labels */
    .labels-area { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start; }
    .label-chip {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(138,131,123,0.15); color: var(--ink);
      padding: 3px 8px; border-radius: 4px; font-size: 11px;
    }
    .label-remove { background: none; border: none; cursor: pointer; color: var(--subtle); font-size: 13px; padding: 0; opacity: 0.6; line-height: 1; }
    .label-remove:hover { opacity: 1; color: var(--accent); }
    .label-add-wrap { position: relative; }
    .btn-add-label {
      border: 1px dashed rgba(212,82,28,0.35); background: none;
      color: var(--accent); padding: 3px 10px; border-radius: 4px;
      font-size: 11px; cursor: pointer; font-family: var(--font-body); white-space: nowrap;
    }
    .btn-add-label:hover { background: rgba(212,82,28,0.08); border-color: var(--accent); }
    .label-input-wrap { display: none; flex-direction: column; gap: 0; position: relative; }
    .label-input-wrap.visible { display: flex; }
    .label-input {
      border: 1px solid var(--accent); border-radius: 5px 5px 0 0; padding: 5px 8px;
      font-size: 12px; font-family: var(--font-body); background: var(--surface-2);
      color: var(--ink); width: 220px; outline: none;
    }
    .label-suggestions {
      border: 1px solid var(--accent); border-top: none;
      border-radius: 0 0 5px 5px; background: var(--surface-2);
      max-height: 160px; overflow-y: auto; width: 220px;
    }
    .label-suggestion { padding: 5px 8px; font-size: 11px; cursor: pointer; color: var(--ink); }
    .label-suggestion:hover, .label-suggestion.active { background: rgba(212,82,28,0.1); }

    /* Document date (auth only) */
    .doc-date-wrap { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .doc-date-input {
      border: 1px solid var(--border); border-radius: 5px; padding: 4px 8px;
      font-size: 12px; font-family: var(--font-mono); background: var(--surface-2);
      color: var(--ink); outline: none; width: 140px;
    }
    .doc-date-input:focus { border-color: var(--accent); }
    .btn-save-date {
      background: var(--ink); border: none; color: var(--bg);
      padding: 4px 12px; border-radius: 5px; font-size: 11px; cursor: pointer;
      font-family: var(--font-body);
    }
    .btn-save-date:hover { background: #D4CEC8; }

    /* Is Private toggle (auth only) */
    .private-toggle-wrap { display: flex; align-items: center; gap: 8px; }
    .private-toggle-label { font-size: 12px; color: var(--ink); }
    .toggle-switch { position: relative; display: inline-block; width: 34px; height: 18px; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--border); transition: .2s; border-radius: 18px;
    }
    .toggle-slider:before {
      position: absolute; content: ''; height: 12px; width: 12px;
      left: 3px; bottom: 3px; background-color: var(--subtle);
      transition: .2s; border-radius: 50%;
    }
    input:checked + .toggle-slider { background-color: #EF4444; }
    input:checked + .toggle-slider:before { transform: translateX(16px); background-color: white; }

    /* Context & Findings */
    .annotation-text { font-family: var(--font-head); font-size: 15px; line-height: 1.7; white-space: pre-wrap; }
    .annotation-placeholder { font-size: 12px; color: var(--subtle); font-style: italic; line-height: 1.6; }
    .annotation-edit { display: none; }
    .annotation-edit.visible { display: block; }
    .annotation-textarea {
      width: 100%; min-height: 120px; border: 1px solid var(--accent); border-radius: 6px;
      padding: 10px 12px; font-family: var(--font-head); font-size: 15px; line-height: 1.7;
      color: var(--ink); background: var(--surface-2); resize: vertical; outline: none;
    }
    .annotation-actions { display: flex; gap: 8px; margin-top: 10px; }
    .btn-edit-ann { border: 1px solid var(--border); background: none; color: var(--subtle); padding: 4px 12px; border-radius: 5px; font-size: 11px; cursor: pointer; font-family: var(--font-body); }
    .btn-edit-ann:hover { border-color: var(--ink); color: var(--ink); }
    .btn-save-ann { background: var(--ink); border: none; color: var(--bg); padding: 4px 14px; border-radius: 5px; font-size: 11px; cursor: pointer; font-family: var(--font-body); display: none; }
    .btn-cancel-ann { border: 1px solid var(--border); background: none; color: var(--subtle); padding: 4px 10px; border-radius: 5px; font-size: 11px; cursor: pointer; font-family: var(--font-body); display: none; }

    /* Linked To */
    .links-empty { font-size: 12px; color: var(--subtle); font-style: italic; margin-bottom: 10px; }
    .link-item { border: 1px solid var(--border); border-radius: 7px; padding: 10px 14px; margin-bottom: 8px; background: var(--surface-2); }
    .link-item-name a { color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 500; font-family: var(--font-head); display: block; }
    .link-item-name a:hover { text-decoration: underline; }
    .link-item-name span { font-size: 13px; font-family: var(--font-head); display: block; }
    .link-item-driveid { font-family: var(--font-mono); font-size: 10px; color: var(--subtle); display: block; margin-top: 2px; }
    .link-item-type { font-size: 12px; color: var(--subtle); margin-top: 5px; }
    .link-item-details { font-size: 12px; color: var(--ink); margin-top: 5px; line-height: 1.5; border-top: 1px solid var(--border); padding-top: 5px; }
    .link-item-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
    .link-item-ts { font-family: var(--font-mono); font-size: 10px; color: var(--subtle); }
    .btn-link-remove { background: none; border: none; font-size: 11px; color: var(--subtle); cursor: pointer; padding: 0; }
    .btn-link-remove:hover { color: #EF4444; }
    .btn-create-link { border: 1px dashed rgba(212,82,28,0.35); background: none; color: var(--accent); padding: 5px 12px; border-radius: 5px; font-size: 11px; cursor: pointer; font-family: var(--font-body); margin-top: 6px; display: inline-block; }
    .btn-create-link:hover { background: rgba(212,82,28,0.08); border-color: var(--accent); }
    .create-link-form { border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-top: 10px; background: var(--surface-2); }
    .link-field { margin-bottom: 12px; }
    .link-field:last-of-type { margin-bottom: 4px; }
    .link-field-label { display: block; font-size: 10px; font-weight: 600; color: var(--subtle); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 5px; }
    .link-input { width: 100%; border: 1px solid var(--border); border-radius: 5px; padding: 7px 10px; font-size: 12px; font-family: var(--font-body); background: var(--surface); color: var(--ink); outline: none; }
    .link-input:focus { border-color: var(--accent); }
    .link-input.error { border-color: #EF4444; }
    .link-textarea { width: 100%; border: 1px solid var(--border); border-radius: 5px; padding: 7px 10px; font-size: 12px; font-family: var(--font-body); background: var(--surface); color: var(--ink); outline: none; resize: vertical; min-height: 70px; }
    .link-textarea:focus { border-color: var(--accent); }
    .link-field-hint { font-size: 10px; color: var(--subtle); margin-top: 3px; line-height: 1.4; }
    .link-form-actions { display: flex; gap: 8px; margin-top: 12px; }
    .btn-save-link { background: var(--ink); color: var(--bg); border: none; padding: 6px 18px; border-radius: 5px; font-size: 12px; font-family: var(--font-body); cursor: pointer; }
    .btn-save-link:hover { background: #D4CEC8; }
    .btn-cancel-link { background: none; border: 1px solid var(--border); color: var(--subtle); padding: 6px 12px; border-radius: 5px; font-size: 12px; font-family: var(--font-body); cursor: pointer; }
    .btn-cancel-link:hover { border-color: var(--ink); color: var(--ink); }

    /* API status toast */
    .toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 999;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 16px; font-size: 12px;
      opacity: 0; transition: opacity 0.2s; pointer-events: none;
    }
    .toast.visible { opacity: 1; }
    .toast.ok { border-color: #22C55E; color: #22C55E; }
    .toast.err { border-color: #EF4444; color: #EF4444; }

    /* ── MOBILE DRAWER ── */
    .cl-menu-btn {
      display: none; align-items: center; justify-content: center;
      width: 36px; height: 36px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--ink); font-size: 16px; cursor: pointer;
      flex-shrink: 0; margin-left: auto;
    }
    .cl-menu-btn:hover { border-color: var(--accent); }
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 49; }
    .sidebar-overlay.visible { display: block; }

    @media (max-width: 768px) {
      body { overflow: hidden; }
      .app-header { padding: 0 14px; }
      .header-right { flex: 1; }
      .header-search input { width: 100%; min-width: 0; }
      .cl-menu-btn { display: flex; }
      .two-pane { grid-template-columns: 1fr; }
      .sidebar {
        position: fixed; top: 56px; left: 0;
        height: calc(100vh - 56px); width: 85vw; max-width: 300px;
        transform: translateX(-100%); transition: transform 0.22s ease;
        z-index: 50; border-right: 1px solid var(--border);
        box-shadow: 4px 0 24px rgba(0,0,0,0.4);
      }
      .sidebar.open { transform: translateX(0); }
      .focus-pane { overflow-y: auto; padding: 20px 18px 60px; }
      .entity-count { display: none; }
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--subtle); }
  </style>
</head>
<body>

<header class="app-header">
  <a href="{{ url_for('home.index') }}" class="brand-link">
    <img class="header-logo-mark" src="{{ url_for('static', filename='img/jdo-logo.svg') }}" alt="JDO">
    <div>
      <div class="brand">जगदिश्वरम् डिजिटल कार्यालय</div>
      <div class="brand-sub">Project Kurukshetra · Case Library</div>
    </div>
  </a>
  <div class="header-right">
    <nav class="site-nav">
      <a href="{{ url_for('home.index') }}" class="nav-pill">Home</a>
      <a href="{{ url_for('narada_qr.generator') }}" class="nav-pill">Submit</a>
      <a href="{{ url_for('vishwakarma.transparency') }}" class="nav-pill">Transparency</a>
      <a href="{{ url_for('home.kurukshetra') }}" class="nav-pill active">Library</a>
    </nav>
    {% if is_authenticated %}
    <button class="btn-rebuild" id="btn-rebuild" onclick="rebuildCache()" title="Rebuild cache from Zoho + Drive">⟳ Rebuild</button>
    {% endif %}
    <div class="header-search">
      <span class="search-icon">⌕</span>
      <input type="search" id="search-input" placeholder="Search by name, authority or label…" oninput="handleSearch(this.value)">
    </div>
    <div class="entity-count" id="entity-count"></div>
  </div>
  <button class="cl-menu-btn" id="cl-menu-btn" aria-label="Toggle directory" onclick="toggleSidebar()">☰</button>
</header>

<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>
<div class="toast" id="toast"></div>

<div class="two-pane">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="filter-strip">
      <select class="filter-select" id="auth-filter" onchange="handleAuthorityFilter(this.value)">
        <option value="">All Authorities</option>
        <option value="MOR">MOR — Tehsildar Vasai</option>
        <option value="NPS">NPS — SDO Vasai</option>
        <option value="DMD">DMD — Collector Palghar</option>
        <option value="EAF">EAF — Arnala Police</option>
        <option value="RPD">RPD — ACP Nalasopara</option>
        <option value="AGD">AGD — MBVV Commissioner</option>
        <option value="SIC">SIC — State Info Commission</option>
        <option value="RPO">RPO — Passport Office</option>
        <option value="JMC">JMC — 4th JMFC Vasai</option>
        <option value="JDC">JDC — District Court</option>
      </select>
      <select class="filter-select" id="label-filter" onchange="handleLabelFilter(this.value)">
        <option value="">All Labels</option>
      </select>
      <select class="filter-select" id="sort-select" onchange="renderList()">
        <option value="date-desc">Newest first</option>
        <option value="date-asc">Oldest first</option>
        <option value="name-asc">Name A–Z</option>
      </select>
    </div>
    <div class="tree-scroll" id="list-wrap">
      <!-- Built by JS -->
    </div>
  </aside>

  <!-- FOCUS PANE -->
  <section class="focus-pane" id="focus-pane">
    <div class="focus-empty">
      <div class="icon">🗂</div>
      <p>Select a document to view its details</p>
    </div>
  </section>

</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// DATA — injected by Flask from Zoho + Drive cache
// ═══════════════════════════════════════════════════════════════════════════
const NODES = {{ nodes | tojson }};
const IS_AUTH = {{ is_authenticated | tojson }};

const ALL_NODES = {};
NODES.forEach(n => { ALL_NODES[n.id] = n; });

// ═══════════════════════════════════════════════════════════════════════════
// AUTHORITY MAP — mirrors Config_Authority_Registry in Zoho DB
// ═══════════════════════════════════════════════════════════════════════════
const AUTHORITY_MAP = {
  'MOR': 'Tehsildar Vasai Office',
  'NPS': 'SDO Vasai Sub-Division',
  'DMD': 'District Collector Palghar',
  'EAF': 'Arnala Coastal Police Station',
  'RPD': 'ACP Nalasopara Division',
  'AGD': 'Police Commissioner MBVV',
  'SIC': 'State Information Commission Maharashtra',
  'RPO': 'Regional Passport Office',
  'JMC': '4th JMFC Vasai',
  'JDC': 'District Court Palghar',
};

const LABEL_SUGGESTIONS = [
  'Order','Evidence','RTI','FIR','Video','Key','Appeal',
  'Hearing','Notice','Affidavit','Petition','Reply',
];

// ═══════════════════════════════════════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════════════════════════════════════
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escSQ(s) { return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

function typeIcon(mime) {
  if (!mime) return '📄';
  if (mime.includes('folder')) return '📁';
  if (mime.includes('video') || mime.includes('quicktime')) return '🎬';
  if (mime.includes('image')) return '🖼';
  if (mime.includes('pdf')) return '📄';
  return '📝';
}
function typeChipClass(mime) {
  if (!mime) return 'chip-pdf';
  if (mime.includes('folder')) return 'chip-folder';
  if (mime.includes('video') || mime.includes('quicktime')) return 'chip-video';
  if (mime.includes('image')) return 'chip-image';
  if (mime.includes('pdf')) return 'chip-pdf';
  return 'chip-doc';
}
function typeLabel(mime) {
  if (!mime) return 'FILE';
  if (mime.includes('folder')) return 'FOLDER';
  if (mime.includes('quicktime')) return 'MOV';
  if (mime.includes('video')) return 'MP4';
  if (mime.includes('image')) return 'IMAGE';
  if (mime.includes('pdf')) return 'PDF';
  return 'FILE';
}

function getAllCustomLabels() {
  const set = new Set();
  NODES.forEach(n => (n.customLabels || []).forEach(l => set.add(l)));
  return [...set].sort();
}

function updateCustomLabelFilter() {
  const sel = document.getElementById('label-filter');
  const cur = sel.value;
  sel.innerHTML = '<option value="">All Labels</option>';
  getAllCustomLabels().forEach(l => {
    const opt = document.createElement('option');
    opt.value = l; opt.textContent = l;
    if (l === cur) opt.selected = true;
    sel.appendChild(opt);
  });
}

function sortDate(a, b, asc) {
  const da = a.documentDate || a.modified || '';
  const db = b.documentDate || b.modified || '';
  return asc ? da.localeCompare(db) : db.localeCompare(da);
}

// ═══════════════════════════════════════════════════════════════════════════
// LIST RENDERING (flat, date-sorted)
// ═══════════════════════════════════════════════════════════════════════════
let selectedId = null;
let _activeAuth = '';
let _activeLabel = '';
let _activeSearch = '';

function buildBadges(node) {
  const acs = node.authorityCodes || [];
  const cl = node.customLabels || [];
  let html = '';
  acs.forEach(ac => { html += `<span class="list-badge list-badge-auth">${ac}</span>`; });
  cl.slice(0, 2).forEach(l => { html += `<span class="list-badge list-badge-custom">${escHtml(l)}</span>`; });
  if (IS_AUTH && node.isPrivate) html += `<span class="list-badge list-badge-private">PRIVATE</span>`;
  if (!node.documentDate) html += `<span class="list-badge list-badge-nodate" title="Document date missing — set it in the focus pane">⚠ No date</span>`;
  return html;
}

function buildListItem(node) {
  const badges = buildBadges(node);
  const dateStr = node.documentDate ? node.documentDate.slice(0, 10) : '';
  return `
    <li id="li-${node.id}">
      <div class="list-item" id="row-${node.id}" onclick="onNodeClick('${escSQ(node.id)}')">
        <span class="list-icon">${typeIcon(node.mime)}</span>
        <span class="list-text">
          <span class="list-name" title="${escHtml(node.name)}">${escHtml(node.name)}</span>
          ${dateStr ? `<span class="list-date">${dateStr}</span>` : ''}
          ${badges ? `<span class="list-badges">${badges}</span>` : ''}
        </span>
      </div>
    </li>`;
}

function getSortedNodes() {
  const sort = document.getElementById('sort-select')?.value || 'date-desc';
  const sorted = [...NODES];
  if (sort === 'date-desc') sorted.sort((a, b) => sortDate(a, b, false));
  else if (sort === 'date-asc') sorted.sort((a, b) => sortDate(a, b, true));
  else sorted.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));
  return sorted;
}

function renderList() {
  const wrap = document.getElementById('list-wrap');
  const sorted = getSortedNodes();
  wrap.innerHTML = `<ul class="flat-list">${sorted.map(n => buildListItem(n)).join('')}</ul>`;
  applyFilters(_activeAuth, _activeLabel);
  if (_activeSearch) handleSearch(_activeSearch);
  updateCustomLabelFilter();
  // Restore selection highlight
  if (selectedId && document.getElementById('row-' + selectedId)) {
    document.getElementById('row-' + selectedId).classList.add('selected');
  }
  // Update entity count
  const el = document.getElementById('entity-count');
  if (el) el.innerHTML = '<strong>' + NODES.length + '</strong> entities';
}

function onNodeClick(id) {
  if (selectedId) {
    const prev = document.getElementById('row-' + selectedId);
    if (prev) prev.classList.remove('selected');
  }
  selectedId = id;
  const row = document.getElementById('row-' + id);
  if (row) row.classList.add('selected');
  renderFocus(id);
  // Close mobile drawer
  if (window.innerWidth <= 768) closeSidebar();
}

function refreshListBadges(id) {
  const li = document.getElementById('li-' + id);
  if (!li) return;
  const node = ALL_NODES[id];
  if (!node) return;
  let badgeEl = li.querySelector('.list-badges');
  const badgesHtml = buildBadges(node);
  if (!badgeEl) {
    if (!badgesHtml) return;
    badgeEl = document.createElement('span');
    badgeEl.className = 'list-badges';
    const textEl = li.querySelector('.list-text');
    if (textEl) textEl.appendChild(badgeEl);
  }
  badgeEl.innerHTML = badgesHtml;
  if (!badgesHtml && badgeEl) badgeEl.remove();
}

// ═══════════════════════════════════════════════════════════════════════════
// FOCUS PANE
// ═══════════════════════════════════════════════════════════════════════════
function renderFocus(id) {
  const node = ALL_NODES[id];
  if (!node) return;
  const authorityCodes = node.authorityCodes || [];
  const customLabels = node.customLabels || [];
  const annotation = node.contextFindings || '';
  const links = node.links || [];

  const authOptions = Object.entries(AUTHORITY_MAP)
    .filter(([code]) => !authorityCodes.includes(code))
    .map(([code, name]) => `<option value="${code}">${code} — ${name}</option>`)
    .join('');

  const fp = document.getElementById('focus-pane');
  fp.innerHTML = `
    <div class="doc-header">
      <div class="doc-chips">
        <span class="chip ${typeChipClass(node.mime)}">${typeLabel(node.mime)}</span>
        ${node.documentType ? `<span class="chip chip-doc">${escHtml(node.documentType)}</span>` : ''}
        ${IS_AUTH && node.isPrivate ? `<span class="chip chip-private">PRIVATE</span>` : ''}
      </div>
      <div class="doc-title">${escHtml(node.name)}</div>
      <div class="doc-path">${escHtml(node.path || '')}</div>
      ${node.url
        ? `<a class="btn-open-file" href="${escHtml(node.url)}" target="_blank" rel="noopener">↗ Open in Google Drive</a>`
        : `<button class="btn-open-file disabled" title="URL not available">↗ Open in Google Drive</button>`}
    </div>

    <!-- DESCRIPTION (read-only from Drive/Sheets) -->
    <div class="meta-block">
      <div class="meta-title">Description <span class="meta-title-note">from Drive · read-only</span></div>
      ${node.description
        ? `<p class="description-text">${escHtml(node.description)}</p>`
        : `<p class="description-empty">No description for this item.</p>`}
    </div>

    <!-- AUDIT TRAIL -->
    <div class="meta-block">
      <div class="meta-title">Audit Trail</div>
      <div class="meta-grid">
        <span class="meta-key">Drive Created</span><span class="meta-val">${node.created || '—'}</span>
        <span class="meta-key">Drive Modified</span><span class="meta-val">${node.modified || '—'}</span>
        <span class="meta-key">Size</span><span class="meta-val">${node.size || '—'}</span>
        <span class="meta-key">MD5 Checksum</span>
        <span class="meta-val mono">${node.md5 ? node.md5.slice(0,20) + '…' : '—'}</span>
      </div>
    </div>

    <!-- DOCUMENT DATE (Zoho Table B — editable if auth) -->
    <div class="meta-block">
      <div class="meta-title">Document Date <span class="meta-title-note">actual date of document · Zoho Table B</span></div>
      ${IS_AUTH
        ? `<div class="doc-date-wrap">
             <input class="doc-date-input" type="date" id="doc-date-${id}"
               value="${escHtml(node.documentDate || '')}"
               placeholder="YYYY-MM-DD">
             <button class="btn-save-date" onclick="saveDate('${escSQ(id)}')">Save</button>
           </div>`
        : `<span class="meta-val">${node.documentDate || '—'}</span>`}
    </div>

    <!-- IS PRIVATE toggle (auth only) -->
    ${IS_AUTH ? `
    <div class="meta-block">
      <div class="meta-title">Visibility <span class="meta-title-note">is_private flag · hides from public</span></div>
      <div class="private-toggle-wrap">
        <label class="toggle-switch">
          <input type="checkbox" id="private-toggle-${id}" ${node.isPrivate ? 'checked' : ''}
                 onchange="togglePrivate('${escSQ(id)}', this.checked)">
          <span class="toggle-slider"></span>
        </label>
        <span class="private-toggle-label">${node.isPrivate ? 'Private — hidden from public view' : 'Public — visible to all'}</span>
      </div>
    </div>` : ''}

    <!-- AUTHORITY CODE (multi-select) -->
    <div class="meta-block">
      <div class="meta-title">Authority Code <span class="meta-title-note">from Config_Authority_Registry · multiple allowed</span></div>
      <div class="authority-code-area" id="auth-area-${id}">
        ${authorityCodes.map(code => `
          <span class="auth-chip" id="auth-chip-${id}-${code}">
            <span class="auth-code">${code}</span>
            <span class="auth-name"> — ${escHtml(AUTHORITY_MAP[code] || '')}</span>
            ${IS_AUTH ? `<button class="label-remove" onclick="removeAuthorityCode('${escSQ(id)}','${code}')" title="Remove">×</button>` : ''}
          </span>`).join('')}
        ${IS_AUTH && authOptions
          ? `<div class="auth-select-wrap">
               <select onchange="addAuthorityCode('${escSQ(id)}', this.value); this.value=''">
                 <option value="">— Add authority —</option>
                 ${authOptions}
               </select>
             </div>`
          : (!authorityCodes.length ? `<span style="font-size:11px;color:var(--subtle);font-style:italic">No authority codes assigned</span>` : '')}
      </div>
    </div>

    <!-- CUSTOM LABELS (free-text) -->
    <div class="meta-block">
      <div class="meta-title">Custom Labels <span class="meta-title-note">free-text tags · Zoho Table B</span></div>
      <div class="labels-area" id="labels-area-${id}">
        ${customLabels.map(l => `
          <span class="label-chip" id="chip-${id}-${l.replace(/[^a-z0-9]/gi,'_')}">
            ${escHtml(l)}
            ${IS_AUTH ? `<button class="label-remove" onclick="removeCustomLabel('${escSQ(id)}','${escSQ(l)}')">×</button>` : ''}
          </span>`).join('')}
        ${IS_AUTH ? `
        <div class="label-add-wrap" id="add-wrap-${id}">
          <button class="btn-add-label" onclick="showLabelInput('${escSQ(id)}')">+ Add Label</button>
          <div class="label-input-wrap" id="inp-wrap-${id}">
            <input class="label-input" id="label-inp-${id}"
              placeholder="Order, Evidence, RTI, FIR…"
              oninput="onLabelInput('${escSQ(id)}', this.value)"
              onkeydown="onLabelKey(event, '${escSQ(id)}')"
              autocomplete="off">
            <div class="label-suggestions" id="label-sugg-${id}"></div>
          </div>
        </div>` : ''}
      </div>
    </div>

    <!-- IDENTIFIERS -->
    <div class="meta-block">
      <div class="meta-title">Identifiers</div>
      <div class="meta-grid">
        <span class="meta-key">Drive ID</span>
        <span class="meta-val mono" title="${escHtml(node.id)}">${node.id ? node.id.slice(0,24) + '…' : '—'}</span>
        <span class="meta-key">MIME Type</span>
        <span class="meta-val mono">${escHtml(node.mime || '—')}</span>
        <span class="meta-key">Drive Path</span>
        <span class="meta-val mono" style="font-size:10px">${escHtml(node.path || '—')}</span>
      </div>
    </div>

    <!-- CONTEXT & FINDINGS (Zoho Table B — HITL annotation) -->
    <div class="meta-block">
      <div class="meta-title">Context &amp; Findings <span class="meta-title-note">HITL annotation · Zoho Table B</span></div>
      <div id="ann-static-${id}">
        ${annotation
          ? `<p class="annotation-text">${escHtml(annotation).replace(/\n/g,'<br>')}</p>`
          : `<p class="annotation-placeholder">No annotation yet. Add the legal significance and context for this document.</p>`}
      </div>
      ${IS_AUTH ? `
      <div class="annotation-edit" id="ann-edit-${id}">
        <textarea class="annotation-textarea" id="ann-ta-${id}" rows="6">${escHtml(annotation)}</textarea>
      </div>
      <div class="annotation-actions">
        <button class="btn-edit-ann" id="btn-edit-${id}" onclick="editAnn('${escSQ(id)}')">✎ Edit</button>
        <button class="btn-save-ann" id="btn-save-${id}" onclick="saveAnn('${escSQ(id)}')">Save</button>
        <button class="btn-cancel-ann" id="btn-cancel-${id}" onclick="cancelAnn('${escSQ(id)}')">Cancel</button>
      </div>` : ''}
    </div>

    <!-- LINKED TO (Zoho Table C) -->
    <div class="meta-block">
      <div class="meta-title">Linked To <span class="meta-title-note">Case_Library_Links · Zoho Table C</span></div>
      <div id="links-list-${id}">
        ${(() => {
          if (!links.length) return `<p class="links-empty">No links created yet.</p>`;
          return links.map(lk => {
            const targetNode = ALL_NODES[lk.linkedId];
            return `
              <div class="link-item">
                <div class="link-item-name">
                  ${targetNode && targetNode.url
                    ? `<a href="${escHtml(targetNode.url)}" target="_blank" rel="noopener">${escHtml(targetNode.name || lk.linkedId)}</a>`
                    : `<span>${escHtml(targetNode ? targetNode.name : lk.linkedId)}</span>`}
                  <span class="link-item-driveid">${escHtml(lk.linkedId)}</span>
                </div>
                ${lk.linkType ? `<div class="link-item-type">${escHtml(lk.linkType)}</div>` : ''}
                ${lk.linkDetails ? `<div class="link-item-details">${escHtml(lk.linkDetails)}</div>` : ''}
                <div class="link-item-footer">
                  <span class="link-item-ts">${lk.timestamp || ''}</span>
                  ${IS_AUTH ? `<button class="btn-link-remove" onclick="deleteLink('${escSQ(id)}','${escSQ(lk.linkedId)}','${escSQ(lk._zohoLinkId || '')}')">Remove</button>` : ''}
                </div>
              </div>`;
          }).join('');
        })()}
      </div>
      ${IS_AUTH ? `
      <div id="create-link-toggle-${id}">
        <button class="btn-create-link" onclick="showCreateLink('${escSQ(id)}')">+ Create Link</button>
      </div>
      <div class="create-link-form" id="create-link-form-${id}" style="display:none">
        <div class="link-field">
          <label class="link-field-label">Drive ID <span style="color:var(--accent);font-weight:700">*</span></label>
          <input class="link-input" id="link-driveid-${id}" placeholder="Paste Google Drive file or folder ID…" autocomplete="off"
                 oninput="this.classList.remove('error')">
          <div class="link-field-hint">If the document exists in this Case Library, its name will resolve automatically.</div>
        </div>
        <div class="link-field">
          <label class="link-field-label">Link Type <span style="color:var(--accent);font-weight:700">*</span></label>
          <input class="link-input" id="link-type-${id}" placeholder="e.g. Referenced in, Evidence for, Cited by…"
                 autocomplete="off" oninput="this.classList.remove('error')">
        </div>
        <div class="link-field">
          <label class="link-field-label">Link Details</label>
          <textarea class="link-textarea" id="link-details-${id}"
            placeholder="Legal/situational context — what does this link reveal in the broader case?"></textarea>
          <div class="link-field-hint">Optional but valuable. Explain the legal significance of this relationship.</div>
        </div>
        <div class="link-form-actions">
          <button class="btn-save-link" onclick="submitLink('${escSQ(id)}')">Add Link</button>
          <button class="btn-cancel-link" onclick="hideCreateLink('${escSQ(id)}')">Cancel</button>
        </div>
      </div>` : ''}
    </div>
  `;
}

// ═══════════════════════════════════════════════════════════════════════════
// API CALLS — all write operations go to Flask → Zoho
// ═══════════════════════════════════════════════════════════════════════════
function showToast(msg, ok) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast visible ' + (ok ? 'ok' : 'err');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.className = 'toast'; }, 2800);
}

async function apiPatch(path, body) {
  const r = await fetch(path, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  return r.json();
}

async function apiPost(path, body) {
  const r = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  return r.json();
}

async function apiDelete(path) {
  const r = await fetch(path, { method: 'DELETE' });
  return r.json();
}

// ── Authority code actions ─────────────────────────────────────────────────
async function addAuthorityCode(id, code) {
  if (!code) return;
  const node = ALL_NODES[id];
  if (!node) return;
  const old = [...(node.authorityCodes || [])];
  if (old.includes(code)) return;
  node.authorityCodes = [...old, code];
  renderFocus(id);
  refreshListBadges(id);
  const r = await apiPatch(`/api/kurukshetra/${encodeURIComponent(id)}/labels`, { action: 'add_authority', value: code });
  if (!r.ok) { node.authorityCodes = old; renderFocus(id); refreshListBadges(id); showToast('Failed to save', false); }
  else showToast('Authority code added', true);
}

async function removeAuthorityCode(id, code) {
  const node = ALL_NODES[id];
  if (!node) return;
  const old = [...(node.authorityCodes || [])];
  node.authorityCodes = old.filter(c => c !== code);
  renderFocus(id);
  refreshListBadges(id);
  const r = await apiPatch(`/api/kurukshetra/${encodeURIComponent(id)}/labels`, { action: 'remove_authority', value: code });
  if (!r.ok) { node.authorityCodes = old; renderFocus(id); refreshListBadges(id); showToast('Failed to save', false); }
  else showToast('Authority code removed', true);
}

// ── Custom label actions ───────────────────────────────────────────────────
let activeSugg = -1;

function showLabelInput(id) {
  document.getElementById(`inp-wrap-${id}`).classList.add('visible');
  document.getElementById(`label-inp-${id}`).focus();
}

function onLabelInput(id, val) {
  const suggBox = document.getElementById(`label-sugg-${id}`);
  activeSugg = -1;
  if (!val.trim()) { suggBox.innerHTML = ''; return; }
  const existing = getAllCustomLabels();
  const pool = [...LABEL_SUGGESTIONS, ...existing.filter(l => !LABEL_SUGGESTIONS.includes(l))];
  const matches = pool.filter(s => s.toLowerCase().includes(val.toLowerCase())).slice(0, 6);
  suggBox.innerHTML = matches.map(s =>
    `<div class="label-suggestion" data-val="${escHtml(s)}" onclick="commitCustomLabel('${escSQ(id)}','${escSQ(s)}')">
       ${escHtml(s)}
     </div>`
  ).join('');
}

function onLabelKey(e, id) {
  const suggBox = document.getElementById(`label-sugg-${id}`);
  const items = suggBox.querySelectorAll('.label-suggestion');
  if (e.key === 'ArrowDown') { activeSugg = Math.min(activeSugg + 1, items.length - 1); items.forEach((el, i) => el.classList.toggle('active', i === activeSugg)); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { activeSugg = Math.max(activeSugg - 1, 0); items.forEach((el, i) => el.classList.toggle('active', i === activeSugg)); e.preventDefault(); }
  else if (e.key === 'Enter') {
    if (activeSugg >= 0 && items[activeSugg]) commitCustomLabel(id, items[activeSugg].dataset.val);
    else { const inp = document.getElementById(`label-inp-${id}`); if (inp.value.trim()) commitCustomLabel(id, inp.value.trim()); }
    e.preventDefault();
  } else if (e.key === 'Escape') { closeLabelInput(id); }
}

function closeLabelInput(id) {
  const wrap = document.getElementById(`inp-wrap-${id}`);
  const inp = document.getElementById(`label-inp-${id}`);
  const sugg = document.getElementById(`label-sugg-${id}`);
  if (wrap) wrap.classList.remove('visible');
  if (inp) inp.value = '';
  if (sugg) sugg.innerHTML = '';
  activeSugg = -1;
}

async function commitCustomLabel(id, rawVal) {
  if (!rawVal || !rawVal.trim()) return;
  const val = rawVal.trim();
  const node = ALL_NODES[id];
  if (!node) return;
  const old = [...(node.customLabels || [])];
  if (old.map(l => l.toLowerCase()).includes(val.toLowerCase())) { closeLabelInput(id); return; }
  node.customLabels = [...old, val];
  closeLabelInput(id);
  renderFocus(id);
  refreshListBadges(id);
  updateCustomLabelFilter();
  const r = await apiPatch(`/api/kurukshetra/${encodeURIComponent(id)}/labels`, { action: 'add_label', value: val });
  if (!r.ok) { node.customLabels = old; renderFocus(id); refreshListBadges(id); updateCustomLabelFilter(); showToast('Failed to save', false); }
  else showToast('Label added', true);
}

async function removeCustomLabel(id, label) {
  const node = ALL_NODES[id];
  if (!node) return;
  const old = [...(node.customLabels || [])];
  node.customLabels = old.filter(l => l !== label);
  renderFocus(id);
  refreshListBadges(id);
  updateCustomLabelFilter();
  const r = await apiPatch(`/api/kurukshetra/${encodeURIComponent(id)}/labels`, { action: 'remove_label', value: label });
  if (!r.ok) { node.customLabels = old; renderFocus(id); refreshListBadges(id); updateCustomLabelFilter(); showToast('Failed to save', false); }
  else showToast('Label removed', true);
}

// ── Annotation ─────────────────────────────────────────────────────────────
function editAnn(id) {
  document.getElementById('ann-static-' + id).style.display = 'none';
  document.getElementById('ann-edit-' + id).classList.add('visible');
  document.getElementById('btn-edit-' + id).style.display = 'none';
  document.getElementById('btn-save-' + id).style.display = 'inline-block';
  document.getElementById('btn-cancel-' + id).style.display = 'inline-block';
  document.getElementById('ann-ta-' + id).focus();
}

async function saveAnn(id) {
  const node = ALL_NODES[id];
  if (!node) return;
  const val = document.getElementById('ann-ta-' + id).value;
  const old = node.contextFindings;
  node.contextFindings = val;
  renderFocus(id);
  const r = await apiPatch(`/api/kurukshetra/${encodeURIComponent(id)}/context`, { context_findings: val });
  if (!r.ok) { node.contextFindings = old; renderFocus(id); showToast('Failed to save', false); }
  else showToast('Context saved', true);
}

function cancelAnn(id) { renderFocus(id); }

// ── Document date ──────────────────────────────────────────────────────────
async function saveDate(id) {
  const node = ALL_NODES[id];
  if (!node) return;
  const val = document.getElementById('doc-date-' + id)?.value || '';
  const old = node.documentDate;
  node.documentDate = val;
  const r = await apiPatch(`/api/kurukshetra/${encodeURIComponent(id)}/date`, { document_date: val });
  if (!r.ok) { node.documentDate = old; showToast('Failed to save date', false); }
  else { refreshListBadges(id); showToast('Date saved', true); }
}

// ── Is Private toggle ──────────────────────────────────────────────────────
async function togglePrivate(id, checked) {
  const node = ALL_NODES[id];
  if (!node) return;
  const old = node.isPrivate;
  node.isPrivate = checked;
  refreshListBadges(id);
  const label = document.querySelector(`#focus-pane .private-toggle-label`);
  if (label) label.textContent = checked ? 'Private — hidden from public view' : 'Public — visible to all';
  const r = await apiPatch(`/api/kurukshetra/${encodeURIComponent(id)}/private`, { is_private: checked });
  if (!r.ok) { node.isPrivate = old; refreshListBadges(id); showToast('Failed to update visibility', false); }
  else showToast(checked ? 'Marked private' : 'Marked public', true);
}

// ── Links ──────────────────────────────────────────────────────────────────
function showCreateLink(id) {
  document.getElementById(`create-link-form-${id}`).style.display = 'block';
  document.getElementById(`create-link-toggle-${id}`).style.display = 'none';
  document.getElementById(`link-driveid-${id}`).focus();
}
function hideCreateLink(id) {
  document.getElementById(`create-link-form-${id}`).style.display = 'none';
  document.getElementById(`create-link-toggle-${id}`).style.display = '';
  document.getElementById(`link-driveid-${id}`).value = '';
  document.getElementById(`link-type-${id}`).value = '';
  document.getElementById(`link-details-${id}`).value = '';
}

async function submitLink(id) {
  const linkedId = document.getElementById(`link-driveid-${id}`).value.trim();
  const linkType = document.getElementById(`link-type-${id}`).value.trim();
  const linkDetails = document.getElementById(`link-details-${id}`).value.trim();
  let valid = true;
  if (!linkedId) { document.getElementById(`link-driveid-${id}`).classList.add('error'); valid = false; }
  if (!linkType)  { document.getElementById(`link-type-${id}`).classList.add('error'); valid = false; }
  if (!valid) return;

  const r = await apiPost('/api/kurukshetra/link', {
    source_id: id, linked_id: linkedId,
    link_type: linkType, link_details: linkDetails,
  });
  if (r.ok) {
    const node = ALL_NODES[id];
    if (node) {
      node.links = node.links || [];
      node.links.push({ linkedId, linkType, linkDetails, timestamp: r.timestamp, _zohoLinkId: r.link_id });
    }
    hideCreateLink(id);
    renderFocus(id);
    showToast('Link created', true);
  } else {
    showToast('Failed to create link: ' + (r.error || ''), false);
  }
}

async function deleteLink(sourceId, linkedId, zohoLinkId) {
  if (!zohoLinkId) { showToast('Cannot delete: link ID unknown (rebuild cache first)', false); return; }
  const r = await apiDelete(`/api/kurukshetra/link/${encodeURIComponent(zohoLinkId)}`);
  if (r.ok) {
    const node = ALL_NODES[sourceId];
    if (node) node.links = (node.links || []).filter(lk => lk.linkedId !== linkedId);
    renderFocus(sourceId);
    showToast('Link removed', true);
  } else {
    showToast('Failed to remove link', false);
  }
}

// ── Rebuild cache ──────────────────────────────────────────────────────────
async function rebuildCache() {
  const btn = document.getElementById('btn-rebuild');
  if (!btn) return;
  btn.textContent = '⟳ Rebuilding…';
  btn.classList.add('loading');
  const r = await apiPost('/api/kurukshetra/rebuild-cache', {});
  btn.textContent = '⟳ Rebuild';
  btn.classList.remove('loading');
  if (r.ok) showToast('Cache rebuilt — reload to see updates', true);
  else showToast('Rebuild failed: ' + (r.error || ''), false);
}

// ═══════════════════════════════════════════════════════════════════════════
// SEARCH & FILTER
// ═══════════════════════════════════════════════════════════════════════════
function handleSearch(q) {
  _activeSearch = q;
  q = q.toLowerCase().trim();
  document.querySelectorAll('.list-item').forEach(row => {
    const id = row.id.replace('row-', '');
    const node = ALL_NODES[id];
    if (!node) return;
    const name = node.name.toLowerCase();
    const acStr = (node.authorityCodes || []).join(' ').toLowerCase();
    const acFull = (node.authorityCodes || []).map(c => (AUTHORITY_MAP[c] || '').toLowerCase()).join(' ');
    const cl = (node.customLabels || []).join(' ').toLowerCase();
    const desc = (node.description || '').toLowerCase();
    const match = !q || name.includes(q) || acStr.includes(q) || acFull.includes(q) || cl.includes(q) || desc.includes(q);
    const li = row.closest('li');
    if (li) li.classList.toggle('hidden', !match);
  });
}

function applyFilters(authCode, customLabel) {
  document.querySelectorAll('.list-item').forEach(row => {
    const id = row.id.replace('row-', '');
    const node = ALL_NODES[id];
    if (!node) return;
    const authMatch = !authCode || (node.authorityCodes || []).includes(authCode);
    const labelMatch = !customLabel || (node.customLabels || []).some(l => l === customLabel);
    const li = row.closest('li');
    if (li) li.classList.toggle('hidden', !(authMatch && labelMatch));
  });
}

function handleAuthorityFilter(code) {
  _activeAuth = code;
  applyFilters(code, _activeLabel);
}
function handleLabelFilter(label) {
  _activeLabel = label;
  applyFilters(_activeAuth, label);
}

function toggleSidebar() {
  const sidebar = document.querySelector('.sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  const isOpen = sidebar.classList.toggle('open');
  overlay.classList.toggle('visible', isOpen);
}
function closeSidebar() {
  document.querySelector('.sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('visible');
}
