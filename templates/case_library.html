<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Case Library — जगदिश्वरम् डिजिटल कार्यालय</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/jdo-logo.svg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #EDE9E4;
      --bg: #0F0D0B;
      --accent: #D4521C;
      --border: #2D2823;
      --subtle: #8A837B;
      --surface: #1C1916;
      --surface-2: #242018;
      --font-head: 'Crimson Pro', Georgia, serif;
      --font-body: 'Inter', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--ink);
      font-size: 13px;
      line-height: 1.5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── HEADER ── */
    .app-header {
      height: 56px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 12px;
      flex-shrink: 0;
      background: var(--bg);
    }
    .header-logo-mark { width: 26px; height: 26px; object-fit: contain; flex-shrink: 0; }
    .brand { font-family: var(--font-head); font-size: 17px; font-weight: 600; white-space: nowrap; }
    .brand-sub { font-size: 10px; color: var(--subtle); }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
    .header-search { position: relative; }
    .header-search input {
      width: 280px; border: 1px solid var(--border); border-radius: 6px;
      padding: 6px 10px 6px 28px; font-size: 12px; font-family: var(--font-body);
      background: var(--surface); color: var(--ink);
    }
    .header-search input:focus { outline: 2px solid var(--accent); outline-offset: 2px; border-color: transparent; }
    .search-icon { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); color: var(--subtle); font-size: 12px; pointer-events: none; }
    .entity-count { font-size: 11px; color: var(--subtle); white-space: nowrap; }
    .entity-count strong { color: var(--accent); }

    /* ── TWO PANE ── */
    .two-pane { display: grid; grid-template-columns: 288px 1fr; flex: 1; overflow: hidden; }

    /* ── SIDEBAR ── */
    .sidebar { border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
    .filter-strip {
      padding: 8px 10px; border-bottom: 1px solid var(--border);
      display: flex; gap: 5px; align-items: center; flex-shrink: 0; flex-wrap: wrap;
    }
    .filter-select {
      flex: 1; min-width: 100px; border: 1px solid var(--border); border-radius: 5px;
      padding: 4px 6px; font-size: 11px; font-family: var(--font-body);
      background: var(--surface); color: var(--ink); cursor: pointer;
    }
    .filter-select:focus { outline: 1px solid var(--accent); }
    .tree-scroll { overflow-y: auto; flex: 1; padding: 6px 0; }

    /* ── TREE ── */
    .tree, .tree ul { list-style: none; }
    .section-header {
      font-size: 9px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--subtle);
      padding: 12px 12px 4px; margin-top: 4px;
    }
    .section-header:first-child { margin-top: 0; }
    .tree-row {
      display: flex; align-items: center; padding: 5px 8px 5px 0;
      cursor: pointer; border-left: 3px solid transparent; gap: 4px;
      user-select: none;
    }
    .tree-row:hover { background: rgba(212,82,28,0.06); }
    .tree-row.selected { background: rgba(212,82,28,0.12); border-left-color: var(--accent); }
    .tree-row.hidden { display: none; }
    .tree-caret {
      width: 14px; flex-shrink: 0; font-size: 9px; color: var(--subtle);
      text-align: center; transition: transform 0.15s;
    }
    .tree-caret.open { transform: rotate(90deg); }
    .tree-caret.leaf { opacity: 0; }
    .tree-icon { flex-shrink: 0; font-size: 13px; }
    .tree-text { flex: 1; min-width: 0; }
    .tree-name {
      font-family: var(--font-head); font-size: 13px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block;
    }
    .tree-label-badges { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 1px; }
    .tree-badge {
      font-size: 9px; font-weight: 600; padding: 0 4px;
      border-radius: 3px; white-space: nowrap;
    }
    .tree-badge-auth { background: rgba(212,82,28,0.18); color: var(--accent); }
    .tree-badge-custom { background: rgba(138,131,123,0.18); color: var(--subtle); }
    .tree-children { display: none; padding-left: 16px; }
    .tree-children.open { display: block; }
    .depth-0 { padding-left: 10px; }
    .depth-1 .tree-row { padding-left: 10px; }
    .depth-2 .tree-row { padding-left: 10px; }

    /* ── FOCUS PANE ── */
    .focus-pane { overflow-y: auto; padding: 32px 40px; background: var(--surface); }
    .focus-empty {
      height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: var(--subtle); gap: 10px;
    }
    .focus-empty .icon { font-size: 36px; opacity: 0.2; }
    .focus-empty p { font-size: 13px; }

    /* Doc header */
    .doc-header { margin-bottom: 28px; }
    .doc-chips { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
    .chip {
      display: inline-flex; align-items: center; padding: 2px 8px;
      border-radius: 4px; font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    .chip-pdf    { background: #2B1800; color: #FCD34D; }
    .chip-folder { background: #0A1A30; color: #93C5FD; }
    .chip-video  { background: #250A16; color: #F9A8D4; }
    .chip-image  { background: #071A0F; color: #6EE7B7; }
    .chip-doc    { background: #0F0D2A; color: #A5B4FC; }
    .doc-title { font-family: var(--font-head); font-size: 22px; font-weight: 600; line-height: 1.3; margin-bottom: 4px; }
    .doc-path { font-size: 11px; color: var(--subtle); font-family: var(--font-mono); margin-bottom: 14px; }
    .btn-open-file {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--ink); color: var(--bg);
      border: none; padding: 8px 16px; border-radius: 7px;
      font-size: 12px; font-family: var(--font-body); font-weight: 500;
      cursor: pointer; text-decoration: none;
    }
    .btn-open-file:hover { background: #D4CEC8; }
    .btn-open-file.disabled { background: #3D3930; color: var(--subtle); cursor: not-allowed; }

    /* Meta blocks */
    .meta-block { margin-bottom: 24px; }
    .meta-title {
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--subtle);
      margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border);
      display: flex; align-items: baseline; gap: 6px;
    }
    .meta-title-note {
      font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 9px; color: var(--subtle);
    }
    .meta-grid { display: grid; grid-template-columns: 106px 1fr; gap: 7px 10px; font-size: 12px; }
    .meta-key { color: var(--subtle); align-self: start; padding-top: 1px; }
    .meta-val { color: var(--ink); word-break: break-all; }
    .meta-val.mono { font-family: var(--font-mono); font-size: 11px; }

    /* Description from spreadsheet */
    .description-text { font-size: 13px; color: var(--ink); line-height: 1.6; }
    .description-empty { font-size: 12px; color: var(--subtle); font-style: italic; }

    /* Authority code section */
    .authority-code-area { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .auth-chip {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(212,82,28,0.14); color: var(--accent);
      padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: 500;
    }
    .auth-chip .auth-name { color: var(--subtle); font-weight: 400; }
    .auth-select-wrap select {
      border: 1px solid var(--border); border-radius: 5px; padding: 4px 8px;
      font-size: 11px; font-family: var(--font-body);
      background: var(--surface-2); color: var(--ink); cursor: pointer;
    }
    .auth-select-wrap select:focus { outline: 1px solid var(--accent); }

    /* Custom labels */
    .labels-area { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start; }
    .label-chip {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(138,131,123,0.15); color: var(--ink);
      padding: 3px 8px; border-radius: 4px; font-size: 11px;
    }
    .label-remove {
      background: none; border: none; cursor: pointer;
      color: var(--subtle); font-size: 13px; padding: 0; opacity: 0.6; line-height: 1;
    }
    .label-remove:hover { opacity: 1; color: var(--accent); }
    .label-add-wrap { position: relative; }
    .btn-add-label {
      border: 1px dashed rgba(212,82,28,0.35); background: none;
      color: var(--accent); padding: 3px 10px; border-radius: 4px;
      font-size: 11px; cursor: pointer; font-family: var(--font-body); white-space: nowrap;
    }
    .btn-add-label:hover { background: rgba(212,82,28,0.08); border-color: var(--accent); }
    .label-input-wrap { display: none; flex-direction: column; gap: 0; position: relative; }
    .label-input-wrap.visible { display: flex; }
    .label-input {
      border: 1px solid var(--accent); border-radius: 5px 5px 0 0; padding: 5px 8px;
      font-size: 12px; font-family: var(--font-body); background: var(--surface-2);
      color: var(--ink); width: 220px; outline: none;
    }
    .label-suggestions {
      border: 1px solid var(--accent); border-top: none;
      border-radius: 0 0 5px 5px; background: var(--surface-2);
      max-height: 160px; overflow-y: auto; width: 220px;
    }
    .label-suggestion {
      padding: 5px 8px; font-size: 11px; cursor: pointer; color: var(--ink);
    }
    .label-suggestion:hover, .label-suggestion.active { background: rgba(212,82,28,0.1); }
    .label-suggestion-code { font-weight: 600; color: var(--accent); }

    /* Context & Findings */
    .annotation-text { font-family: var(--font-head); font-size: 15px; line-height: 1.7; white-space: pre-wrap; }
    .annotation-placeholder { font-size: 12px; color: var(--subtle); font-style: italic; line-height: 1.6; }
    .annotation-edit { display: none; }
    .annotation-edit.visible { display: block; }
    .annotation-textarea {
      width: 100%; min-height: 120px; border: 1px solid var(--accent); border-radius: 6px;
      padding: 10px 12px; font-family: var(--font-head); font-size: 15px; line-height: 1.7;
      color: var(--ink); background: var(--surface-2); resize: vertical; outline: none;
    }
    .annotation-actions { display: flex; gap: 8px; margin-top: 10px; }
    .btn-edit-ann {
      border: 1px solid var(--border); background: none; color: var(--subtle);
      padding: 4px 12px; border-radius: 5px; font-size: 11px; cursor: pointer;
      font-family: var(--font-body);
    }
    .btn-edit-ann:hover { border-color: var(--ink); color: var(--ink); }
    .btn-save-ann {
      background: var(--ink); border: none; color: var(--bg);
      padding: 4px 14px; border-radius: 5px; font-size: 11px; cursor: pointer;
      font-family: var(--font-body); display: none;
    }
    .btn-cancel-ann {
      border: 1px solid var(--border); background: none; color: var(--subtle);
      padding: 4px 10px; border-radius: 5px; font-size: 11px; cursor: pointer;
      font-family: var(--font-body); display: none;
    }

    /* ── LINKED TO ── */
    .links-empty { font-size: 12px; color: var(--subtle); font-style: italic; margin-bottom: 10px; }
    .link-item {
      border: 1px solid var(--border); border-radius: 7px; padding: 10px 14px;
      margin-bottom: 8px; background: var(--surface-2);
    }
    .link-item-name a {
      color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 500;
      font-family: var(--font-head); display: block;
    }
    .link-item-name a:hover { text-decoration: underline; }
    .link-item-name span {
      font-size: 13px; font-family: var(--font-head); display: block;
    }
    .link-item-driveid {
      font-family: var(--font-mono); font-size: 10px; color: var(--subtle);
      display: block; margin-top: 2px;
    }
    .link-item-type {
      font-size: 12px; color: var(--subtle); margin-top: 5px;
      border-top: 1px solid var(--border); padding-top: 5px; line-height: 1.5;
    }
    .link-item-footer {
      display: flex; justify-content: space-between; align-items: center; margin-top: 6px;
    }
    .link-item-ts { font-family: var(--font-mono); font-size: 10px; color: var(--subtle); }
    .btn-link-remove {
      background: none; border: none; font-size: 11px; color: var(--subtle);
      cursor: pointer; padding: 0;
    }
    .btn-link-remove:hover { color: #EF4444; }
    .btn-create-link {
      border: 1px dashed rgba(212,82,28,0.35); background: none;
      color: var(--accent); padding: 5px 12px; border-radius: 5px;
      font-size: 11px; cursor: pointer; font-family: var(--font-body);
      margin-top: 6px; display: inline-block;
    }
    .btn-create-link:hover { background: rgba(212,82,28,0.08); border-color: var(--accent); }
    .create-link-form {
      border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px;
      margin-top: 10px; background: var(--surface-2);
    }
    .link-field { margin-bottom: 12px; }
    .link-field:last-of-type { margin-bottom: 4px; }
    .link-field-label {
      display: block; font-size: 10px; font-weight: 600; color: var(--subtle);
      text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 5px;
    }
    .link-input {
      width: 100%; border: 1px solid var(--border); border-radius: 5px;
      padding: 7px 10px; font-size: 12px; font-family: var(--font-body);
      background: var(--surface); color: var(--ink); outline: none;
    }
    .link-input:focus { border-color: var(--accent); }
    .link-input.error { border-color: #EF4444; }
    .link-field-hint { font-size: 10px; color: var(--subtle); margin-top: 3px; line-height: 1.4; }
    .link-form-actions { display: flex; gap: 8px; margin-top: 12px; }
    .btn-save-link {
      background: var(--ink); color: var(--bg); border: none;
      padding: 6px 18px; border-radius: 5px; font-size: 12px;
      font-family: var(--font-body); cursor: pointer;
    }
    .btn-save-link:hover { background: #D4CEC8; }
    .btn-cancel-link {
      background: none; border: 1px solid var(--border); color: var(--subtle);
      padding: 6px 12px; border-radius: 5px; font-size: 12px;
      font-family: var(--font-body); cursor: pointer;
    }
    .btn-cancel-link:hover { border-color: var(--ink); color: var(--ink); }

    /* ── MOBILE DRAWER ── */
    .cl-menu-btn {
      display: none;
      align-items: center; justify-content: center;
      width: 36px; height: 36px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--ink); font-size: 16px; cursor: pointer;
      flex-shrink: 0; margin-left: auto;
    }
    .cl-menu-btn:hover { border-color: var(--accent); }
    .sidebar-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.55); z-index: 49;
    }
    .sidebar-overlay.visible { display: block; }

    @media (max-width: 768px) {
      body { overflow: hidden; }
      .app-header { padding: 0 14px; }
      .header-right { flex: 1; }
      .header-search input { width: 100%; min-width: 0; }
      .cl-menu-btn { display: flex; }
      .two-pane { grid-template-columns: 1fr; }
      .sidebar {
        position: fixed; top: 56px; left: 0;
        height: calc(100vh - 56px); width: 85vw; max-width: 300px;
        transform: translateX(-100%); transition: transform 0.22s ease;
        z-index: 50; border-right: 1px solid var(--border);
        box-shadow: 4px 0 24px rgba(0,0,0,0.4);
      }
      .sidebar.open { transform: translateX(0); }
      .focus-pane { overflow-y: auto; padding: 20px 18px 60px; }
      .entity-count { display: none; }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--subtle); }
  </style>
</head>
<body>

<header class="app-header">
  <img class="header-logo-mark" src="{{ url_for('static', filename='img/jdo-logo.svg') }}" alt="JDO">
  <div>
    <div class="brand">जगदिश्वरम् डिजिटल कार्यालय</div>
    <div class="brand-sub">Project Kurukshetra · Case Library</div>
  </div>
  <div class="header-right">
    <div class="header-search">
      <span class="search-icon">⌕</span>
      <input type="search" id="search-input" placeholder="Search by name, authority or label…" oninput="handleSearch(this.value)">
    </div>
    <div class="entity-count" id="entity-count"></div>
  </div>
  <button class="cl-menu-btn" id="cl-menu-btn" aria-label="Toggle directory" onclick="toggleSidebar()">☰</button>
</header>

<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

<div class="two-pane">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="filter-strip">
      <select class="filter-select" id="auth-filter" onchange="handleAuthorityFilter(this.value)">
        <option value="">All Authorities</option>
        <option value="MOR">MOR — Tehsildar Vasai</option>
        <option value="NPS">NPS — SDO Vasai</option>
        <option value="DMD">DMD — Collector Palghar</option>
        <option value="EAF">EAF — Arnala Police</option>
        <option value="RPD">RPD — ACP Nalasopara</option>
        <option value="AGD">AGD — MBVV Commissioner</option>
        <option value="SIC">SIC — State Info Commission</option>
        <option value="RPO">RPO — Passport Office</option>
        <option value="JMC">JMC — 4th JMFC Vasai</option>
        <option value="JDC">JDC — District Court</option>
      </select>
      <select class="filter-select" id="label-filter" onchange="handleLabelFilter(this.value)">
        <option value="">All Labels</option>
      </select>
    </div>
    <div class="tree-scroll" id="tree-root-wrap">
      <!-- Built by JS -->
    </div>
  </aside>

  <!-- FOCUS PANE -->
  <section class="focus-pane" id="focus-pane">
    <div class="focus-empty">
      <div class="icon">🗂</div>
      <p>Select a document or folder to view its details</p>
    </div>
  </section>

</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// AUTHORITY MAP — mirrors Config_Authority_Registry in Zoho DB
// ═══════════════════════════════════════════════════════════════════════════

// Flat lookup
const ALL_NODES = {};
function indexNodes(nodes) {
  nodes.forEach(n => { ALL_NODES[n.id] = n; if (n.children) indexNodes(n.children); });
}
indexNodes([...EXHIBIT_NODES, ...LOOSE_NODES]);

// ═══════════════════════════════════════════════════════════════════════════
// STORAGE — two label columns: authorityCodes (multi-value) + customLabels
// authorityCodes: string[] from AUTHORITY_MAP keys (multi-select)
// customLabels: string[] of free-text tags (comma-separated in Zoho multi-line)
// ═══════════════════════════════════════════════════════════════════════════
const STORE_KEY = 'jdo_case_v4';
function loadStore() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; } }
function saveStore(d) { localStorage.setItem(STORE_KEY, JSON.stringify(d)); }
function getNode(id) {
  const s = loadStore();
  return s[id] || { authorityCodes: [], customLabels: [], annotation: '' };
}
function patchNode(id, data) {
  const s = loadStore();
  s[id] = { ...(s[id] || { authorityCodes: [], customLabels: [], annotation: '' }), ...data };
  saveStore(s);
}

// ── NATURAL SORT ── (numeric: true makes Exhibit-2 sort before Exhibit-10)
function sortNodes(arr) {
  return [...arr].sort((a, b) =>
    a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' })
  );
}

function getAllCustomLabels() {
  const s = loadStore();
  const set = new Set();
  Object.values(s).forEach(v => (v.customLabels || []).forEach(l => set.add(l)));
  return [...set].sort();
}

function updateCustomLabelFilter() {
  const sel = document.getElementById('label-filter');
  const cur = sel.value;
  sel.innerHTML = '<option value="">All Labels</option>';
  getAllCustomLabels().forEach(l => {
    const opt = document.createElement('option');
    opt.value = l; opt.textContent = l;
    if (l === cur) opt.selected = true;
    sel.appendChild(opt);
  });
}

// ═══════════════════════════════════════════════════════════════════════════
// TREE RENDERING
// ═══════════════════════════════════════════════════════════════════════════
let selectedId = null;

function typeIcon(type) {
  return { pdf:'📄', folder:'📁', video:'🎬', image:'🖼', doc:'📝' }[type] || '📄';
}
function typeChipClass(type) {
  return { pdf:'chip-pdf', folder:'chip-folder', video:'chip-video', image:'chip-image', doc:'chip-doc' }[type] || 'chip-pdf';
}
function typeLabel(type, mime) {
  if (type === 'folder') return 'FOLDER';
  if (type === 'video') return mime.includes('quicktime') ? 'MOV' : 'MP4';
  if (type === 'image') return 'IMAGE';
  if (type === 'pdf') return 'PDF';
  return type.toUpperCase();
}

function buildBadges(stored) {
  const acs = stored.authorityCodes || [];
  const cl = stored.customLabels || [];
  let html = '';
  acs.forEach(ac => { html += `<span class="tree-badge tree-badge-auth">${ac}</span>`; });
  cl.slice(0, 2).forEach(l => { html += `<span class="tree-badge tree-badge-custom">${escHtml(l)}</span>`; });
  return html;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escSQ(s) { return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

function buildTreeItem(node, depth) {
  const hasChildren = node.children !== undefined;
  const stored = getNode(node.id);
  const badges = buildBadges(stored);

  return `
    <li id="li-${node.id}" data-depth="${depth}">
      <div class="tree-row depth-${depth}" id="row-${node.id}"
           onclick="onNodeClick('${node.id}', ${hasChildren})">
        <span class="tree-caret ${hasChildren ? '' : 'leaf'}" id="caret-${node.id}">▶</span>
        <span class="tree-icon">${typeIcon(node.type)}</span>
        <span class="tree-text">
          <span class="tree-name" title="${escHtml(node.name)}">${escHtml(node.name)}</span>
          ${badges ? `<span class="tree-label-badges">${badges}</span>` : ''}
        </span>
      </div>
      ${hasChildren ? `
        <ul class="tree-children" id="children-${node.id}">
          ${node.children.length
            ? sortNodes(node.children).map(c => buildTreeItem(c, depth + 1)).join('')
            : `<li style="padding:6px 10px 6px 36px;font-size:11px;color:var(--subtle)">
                 Open in Google Drive to browse sub-contents →
               </li>`}
        </ul>` : ''}
    </li>`;
}

function renderTree() {
  const wrap = document.getElementById('tree-root-wrap');
  const allRoot = sortNodes([...EXHIBIT_NODES, ...LOOSE_NODES]);
  wrap.innerHTML = `<ul class="tree">${allRoot.map(n => buildTreeItem(n, 0)).join('')}</ul>`;
  updateCustomLabelFilter();
}

function onNodeClick(id, hasChildren) {
  if (hasChildren) {
    const ch = document.getElementById('children-' + id);
    const cr = document.getElementById('caret-' + id);
    if (ch && cr) {
      const open = ch.classList.toggle('open');
      cr.classList.toggle('open', open);
    }
  }
  if (selectedId) {
    const prev = document.getElementById('row-' + selectedId);
    if (prev) prev.classList.remove('selected');
  }
  selectedId = id;
  document.getElementById('row-' + id).classList.add('selected');
  renderFocus(id);
}

        })()}
      </div>
      <div id="create-link-toggle-${id}">
        <button class="btn-create-link" onclick="showCreateLink('${id}')">+ Create Link</button>
      </div>
      <div class="create-link-form" id="create-link-form-${id}" style="display:none">
        <div class="link-field">
          <label class="link-field-label">Drive ID <span style="color:var(--accent);font-weight:700">*</span></label>
          <input class="link-input" id="link-driveid-${id}" placeholder="Paste Google Drive file or folder ID…" autocomplete="off"
                 oninput="this.classList.remove('error')">
          <div class="link-field-hint">The Drive ID of the document you are linking to. If the document exists in this Case Library, its name and URL will resolve automatically.</div>
        </div>
        <div class="link-field">
          <label class="link-field-label">Link Type <span style="color:var(--accent);font-weight:700">*</span></label>
          <input class="link-input" id="link-type-${id}" placeholder="e.g. This document was presented as attachment of linked file"
                 autocomplete="off" oninput="this.classList.remove('error')">
        </div>
        <div class="link-form-actions">
          <button class="btn-save-link" onclick="submitLink('${id}')">Add Link</button>
          <button class="btn-cancel-link" onclick="hideCreateLink('${id}')">Cancel</button>
        </div>
      </div>
    </div>
  `;
}

function encodeLabel(l) { return l.replace(/[^a-z0-9]/gi, '_'); }

// ═══════════════════════════════════════════════════════════════════════════
// LINKS STORAGE — separate from node store; mirrors Zoho Document_Links report
// Schema per entry: { sourceNodeId, linkedDriveId, linkType, name, url, timestamp }
// ═══════════════════════════════════════════════════════════════════════════
const LINKS_KEY = 'jdo_links_v1';
function loadLinks() { try { return JSON.parse(localStorage.getItem(LINKS_KEY)) || {}; } catch { return {}; } }
function saveLinks(d) { localStorage.setItem(LINKS_KEY, JSON.stringify(d)); }
function getLinks(nodeId) { const l = loadLinks(); return l[nodeId] || []; }
function addLinkEntry(nodeId, entry) {
  const l = loadLinks();
  l[nodeId] = [...(l[nodeId] || []), entry];
  saveLinks(l);
}
function deleteLinkEntry(nodeId, linkedDriveId) {
  const l = loadLinks();
  l[nodeId] = (l[nodeId] || []).filter(lk => lk.linkedDriveId !== linkedDriveId);
  saveLinks(l);
  renderFocus(nodeId);
}

// ── AUTHORITY CODE ACTIONS ─────────────────────────────────────────────────
function addAuthorityCode(id, code) {
  if (!code) return;
  const stored = getNode(id);
  const acs = stored.authorityCodes || [];
  if (!acs.includes(code)) {
    patchNode(id, { authorityCodes: [...acs, code] });
  }
  renderFocus(id);
  refreshTreeBadges(id);
}
function removeAuthorityCode(id, code) {
  const stored = getNode(id);
  const acs = (stored.authorityCodes || []).filter(c => c !== code);
  patchNode(id, { authorityCodes: acs });
  renderFocus(id);
  refreshTreeBadges(id);
}

// ── CUSTOM LABEL ACTIONS ───────────────────────────────────────────────────
let activeSugg = -1;

const LABEL_SUGGESTIONS = [
  { code: 'Order' }, { code: 'Evidence' }, { code: 'RTI' }, { code: 'FIR' },
  { code: 'Video' }, { code: 'Key' }, { code: 'Appeal' }, { code: 'Hearing' },
  { code: 'Notice' }, { code: 'Affidavit' }, { code: 'Petition' }, { code: 'Reply' },
];

function showLabelInput(id) {
  document.getElementById(`inp-wrap-${id}`).classList.add('visible');
  document.getElementById(`label-inp-${id}`).focus();
}

function onLabelInput(id, val) {
  const suggBox = document.getElementById(`label-sugg-${id}`);
  activeSugg = -1;
  if (!val.trim()) { suggBox.innerHTML = ''; return; }
  const existing = getAllCustomLabels();
  const pool = [...LABEL_SUGGESTIONS.map(s => s.code), ...existing.filter(l => !LABEL_SUGGESTIONS.some(s => s.code === l))];
  const matches = pool.filter(s => s.toLowerCase().includes(val.toLowerCase())).slice(0, 6);
  suggBox.innerHTML = matches.map(s =>
    `<div class="label-suggestion" data-val="${escHtml(s)}" onclick="commitCustomLabel('${id}','${escSQ(s)}')">
       <span class="label-suggestion-code">${escHtml(s)}</span>
     </div>`
  ).join('');
}

function onLabelKey(e, id) {
  const suggBox = document.getElementById(`label-sugg-${id}`);
  const items = suggBox.querySelectorAll('.label-suggestion');
  if (e.key === 'ArrowDown') {
    activeSugg = Math.min(activeSugg + 1, items.length - 1);
    items.forEach((el, i) => el.classList.toggle('active', i === activeSugg));
    e.preventDefault();
  } else if (e.key === 'ArrowUp') {
    activeSugg = Math.max(activeSugg - 1, 0);
    items.forEach((el, i) => el.classList.toggle('active', i === activeSugg));
    e.preventDefault();
  } else if (e.key === 'Enter') {
    if (activeSugg >= 0 && items[activeSugg]) {
      commitCustomLabel(id, items[activeSugg].dataset.val);
    } else {
      const inp = document.getElementById(`label-inp-${id}`);
      if (inp.value.trim()) commitCustomLabel(id, inp.value.trim());
    }
    e.preventDefault();
  } else if (e.key === 'Escape') {
    closeLabelInput(id);
  }
}

function commitCustomLabel(id, rawVal) {
  if (!rawVal || !rawVal.trim()) return;
  const val = rawVal.trim();
  const stored = getNode(id);
  const customLabels = stored.customLabels || [];
  if (!customLabels.map(l => l.toLowerCase()).includes(val.toLowerCase())) {
    customLabels.push(val);
    patchNode(id, { customLabels });
  }
  closeLabelInput(id);
  renderFocus(id);
  refreshTreeBadges(id);
  updateCustomLabelFilter();
}

function closeLabelInput(id) {
  const wrap = document.getElementById(`inp-wrap-${id}`);
  const inp = document.getElementById(`label-inp-${id}`);
  const sugg = document.getElementById(`label-sugg-${id}`);
  if (wrap) wrap.classList.remove('visible');
  if (inp) inp.value = '';
  if (sugg) sugg.innerHTML = '';
  activeSugg = -1;
}

function removeCustomLabel(id, label) {
  const stored = getNode(id);
  const customLabels = (stored.customLabels || []).filter(l => l !== label);
  patchNode(id, { customLabels });
  renderFocus(id);
  refreshTreeBadges(id);
  updateCustomLabelFilter();
}

function refreshTreeBadges(id) {
  const li = document.getElementById('li-' + id);
  if (!li) return;
  const nameEl = li.querySelector('.tree-text');
  if (!nameEl) return;
  const stored = getNode(id);
  const badgesHtml = buildBadges(stored);
  let badgeEl = nameEl.querySelector('.tree-label-badges');
  if (!badgeEl) {
    if (!badgesHtml) return;
    badgeEl = document.createElement('span');
    badgeEl.className = 'tree-label-badges';
    nameEl.appendChild(badgeEl);
  }
  badgeEl.innerHTML = badgesHtml;
  if (!badgesHtml) badgeEl.remove();
}

// ── LINKED TO ACTIONS ──────────────────────────────────────────────────────
function showCreateLink(id) {
  document.getElementById(`create-link-form-${id}`).style.display = 'block';
  document.getElementById(`create-link-toggle-${id}`).style.display = 'none';
  document.getElementById(`link-driveid-${id}`).focus();
}
function hideCreateLink(id) {
  document.getElementById(`create-link-form-${id}`).style.display = 'none';
  document.getElementById(`create-link-toggle-${id}`).style.display = '';
  document.getElementById(`link-driveid-${id}`).value = '';
  document.getElementById(`link-type-${id}`).value = '';
}
function submitLink(id) {
  const driveIdEl = document.getElementById(`link-driveid-${id}`);
  const linkTypeEl = document.getElementById(`link-type-${id}`);
  const linkedDriveId = driveIdEl.value.trim();
  const linkType = linkTypeEl.value.trim();

  let valid = true;
  if (!linkedDriveId) { driveIdEl.classList.add('error'); valid = false; }
  if (!linkType)      { linkTypeEl.classList.add('error'); valid = false; }
  if (!valid) return;

  // Resolve name + url from local dataset if Drive ID matches a known node
  const targetNode = Object.values(ALL_NODES).find(n => n.driveId === linkedDriveId);
  addLinkEntry(id, {
    linkedDriveId,
    linkType,
    name: targetNode ? targetNode.name : null,
    url:  targetNode ? (targetNode.url || null) : null,
    timestamp: new Date().toISOString().replace('T', ' ').slice(0, 19) + ' UTC',
  });
  renderFocus(id);
}

// ── ANNOTATION ACTIONS ─────────────────────────────────────────────────────
function editAnn(id) {
  document.getElementById('ann-static-' + id).style.display = 'none';
  document.getElementById('ann-edit-' + id).classList.add('visible');
  document.getElementById('btn-edit-' + id).style.display = 'none';
  document.getElementById('btn-save-' + id).style.display = 'inline-block';
  document.getElementById('btn-cancel-' + id).style.display = 'inline-block';
  document.getElementById('ann-ta-' + id).focus();
}
function saveAnn(id) {
  const val = document.getElementById('ann-ta-' + id).value;
  patchNode(id, { annotation: val });
  renderFocus(id);
}
function cancelAnn(id) { renderFocus(id); }

// ── SEARCH ─────────────────────────────────────────────────────────────────
function handleSearch(q) {
  q = q.toLowerCase().trim();
  document.querySelectorAll('.tree-row').forEach(row => {
    const id = row.id.replace('row-', '');
    if (!id || !ALL_NODES[id]) return;
    const name = ALL_NODES[id].name.toLowerCase();
    const stored = getNode(id);
    const acStr = (stored.authorityCodes || []).join(' ').toLowerCase();
    const acFull = (stored.authorityCodes || []).map(c => (AUTHORITY_MAP[c] || '').toLowerCase()).join(' ');
    const cl = (stored.customLabels || []).join(' ').toLowerCase();
    const match = !q || name.includes(q) || acStr.includes(q) || acFull.includes(q) || cl.includes(q);
    row.closest('li').style.display = match ? '' : 'none';
  });
}

function applyFilters(authCode, customLabel) {
  document.querySelectorAll('.tree-row').forEach(row => {
    const id = row.id.replace('row-', '');
    if (!id || !ALL_NODES[id]) return;
    const stored = getNode(id);
    const authMatch = !authCode || (stored.authorityCodes || []).includes(authCode);
    const labelMatch = !customLabel || (stored.customLabels || []).some(l => l === customLabel);
    row.closest('li').style.display = (authMatch && labelMatch) ? '' : 'none';
  });
}

function handleAuthorityFilter(code) {
  const labelFilter = document.getElementById('label-filter').value;
  applyFilters(code, labelFilter);
}
function handleLabelFilter(label) {
  const authFilter = document.getElementById('auth-filter').value;
  applyFilters(authFilter, label);
}

// ── INIT ───────────────────────────────────────────────────────────────────
renderTree();

// Update entity count display
(function () {
  const count = NODES.length;
  const el = document.getElementById('entity-count');
  if (el) el.innerHTML = '<strong>' + count + '</strong> entities';
})();

// ── MOBILE DRAWER ───────────────────────────────────────────────────────────
function toggleSidebar() {
  const sidebar = document.querySelector('.sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  const isOpen  = sidebar.classList.toggle('open');
  overlay.classList.toggle('visible', isOpen);
}
function closeSidebar() {
  document.querySelector('.sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('visible');
}
// Close drawer when a tree node is selected on mobile
document.querySelector('.sidebar').addEventListener('click', function (e) {
  if (window.innerWidth <= 768 && e.target.closest('.tree-row')) {
    closeSidebar();
  }
});
</script>
