<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kurukshetra — Access</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/jdo-logo.svg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #EDE9E4; --bg: #0F0D0B; --accent: #D4521C;
      --border: #2D2823; --subtle: #8A837B; --surface: #1C1916;
      --font-head: 'Crimson Pro', Georgia, serif;
      --font-body: 'Inter', system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body); background: var(--bg); color: var(--ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .gate-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 40px 36px; width: 100%; max-width: 380px;
      text-align: center;
    }
    .gate-title {
      font-family: var(--font-head); font-size: 24px; font-weight: 600;
      margin-bottom: 4px;
    }
    .gate-sub { font-size: 12px; color: var(--subtle); margin-bottom: 28px; line-height: 1.5; }
    input[type="password"] {
      width: 100%; border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 14px; font-size: 14px; font-family: var(--font-body);
      background: var(--bg); color: var(--ink); margin-bottom: 12px;
    }
    input[type="password"]:focus { outline: 2px solid var(--accent); outline-offset: 2px; border-color: transparent; }
    .btn-enter {
      width: 100%; background: var(--ink); color: var(--bg); border: none;
      padding: 12px; border-radius: 8px; font-size: 14px; font-family: var(--font-body);
      font-weight: 500; cursor: pointer;
    }
    .btn-enter:hover { background: #D4CEC8; }
    .gate-error { font-size: 12px; color: #FCA5A5; margin-bottom: 12px; }
    .gate-back { display: block; margin-top: 20px; font-size: 12px; color: var(--subtle); text-decoration: none; }
    .gate-back:hover { color: var(--accent); }
  </style>
</head>
<body>
<div class="gate-box">
  <div class="gate-title">कुरुक्षेत्र</div>
  <p class="gate-sub">Project Kurukshetra · Case Library<br>Restricted access — passphrase required</p>
  {% if error %}<div class="gate-error">{{ error }}</div>{% endif %}
  <form method="POST" action="{{ url_for('home.kurukshetra_auth') }}">
    <input type="password" name="passphrase" placeholder="Enter passphrase…" autofocus required>
    <button type="submit" class="btn-enter">Enter →</button>
  </form>
  <a href="{{ url_for('home.index') }}" class="gate-back">← Back to जगदिश्वरम्</a>
</div>
</body>
</html>
