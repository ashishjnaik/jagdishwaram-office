<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Generate Dynamic QR</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 font-sans">
<div class="max-w-6xl mx-auto p-6">
  <h1 class="text-3xl font-bold mb-2">Generate Dynamic QR</h1>
  <p class="text-gray-600 mb-8">Your digital trackable record for any submission to an authority</p>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
    <!-- How This Works -->
    <div class="lg:col-span-4 bg-white rounded-3xl shadow p-8">
      <!-- (same How This Works section as before - unchanged) -->
      <h2 class="text-xl font-semibold mb-6">How This Works</h2>
      <!-- ... keep the same content as your current file ... -->
    </div>

    <!-- Form -->
    <div class="lg:col-span-8 bg-white rounded-3xl shadow p-8">
      <form id="qrForm" class="grid grid-cols-2 gap-x-6 gap-y-8">
        <!-- (same form fields as before - name, email, contact, authority, submission_type, eta, url, note) -->
        <!-- ... keep the same fields ... -->
        <div class="col-span-2">
          <button type="submit" id="generateBtn" 
                  class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-5 rounded-3xl text-lg font-medium shadow-lg">
            GENERATE QR CODE
          </button>
        </div>
      </form>

      <!-- Preview -->
      <div id="previewSection" class="hidden mt-10 border-2 border-dashed border-emerald-300 rounded-3xl p-8 text-center">
        <div class="mx-auto mb-6 w-72 h-72 bg-white shadow-inner rounded-2xl flex items-center justify-center p-4" id="qrPreview"></div>
        
        <div class="flex gap-4 justify-center">
          <a id="downloadLink" href="#" 
             class="flex-1 max-w-xs px-8 py-5 bg-emerald-600 text-white rounded-3xl hover:bg-emerald-700 font-medium text-lg flex items-center justify-center gap-2">
            ↓ DOWNLOAD PNG
          </a>
          <a href="/generator" 
             class="flex-1 max-w-xs px-8 py-5 bg-gray-800 text-white rounded-3xl hover:bg-gray-900 font-medium text-lg flex items-center justify-center">
            GENERATE NEW
          </a>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* (same JS as before - unchanged) */
document.getElementById('qrForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const formData = new FormData(e.target);
  const data = Object.fromEntries(formData);

  const res = await fetch('/qr/generate', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data)
  });

  const result = await res.json();
  if (result.error) {
    alert(result.error);
    return;
  }

  const previewHTML = `<img src="data:image/png;base64,${result.image_base64}" class="w-full h-full object-contain">`;
  document.getElementById('qrPreview').innerHTML = previewHTML;
  document.getElementById('previewSection').classList.remove('hidden');

  const dl = document.getElementById('downloadLink');
  dl.href = `data:image/png;base64,${result.image_base64}`;
  dl.download = result.download_name;
});

document.getElementById('additional_note').addEventListener('input', function() {
  const count = document.getElementById('charCount') || {textContent: ''};
  count.textContent = `${this.value.length} / 800`;
});
</script>
</body>
</html>
