<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Dynamic QR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
<div class="max-w-6xl mx-auto p-6">
    <!-- Your existing layout (How This Works + Form) remains unchanged except dropdowns -->
    <select id="recipient_authority_code" name="recipient_authority_code" class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:border-emerald-500">
        <option value="">Loading authorities...</option>
    </select>
    <select id="application_type" name="application_type" class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:border-emerald-500">
        <option value="">Loading submission types...</option>
    </select>
    <!-- Rest of your form fields stay exactly as before -->

    <button type="submit" id="generateBtn"
            class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-semibold text-xl py-6 rounded-3xl mt-8 shadow-lg">
        GENERATE QR CODE
    </button>
</div>

<script>
async function loadConfig() {
    try {
        const res = await fetch('/api/config');
        const config = await res.json();

        // Populate Recipient Authority
        const authSelect = document.getElementById('recipient_authority_code');
        authSelect.innerHTML = '<option value="">-- Select Authority --</option>';
        config.authorities.forEach(a => {
            const opt = document.createElement('option');
            opt.value = a.code;
            opt.textContent = `${a.code} - ${a.name}`;
            authSelect.appendChild(opt);
        });

        // Populate Submission Type
        const typeSelect = document.getElementById('application_type');
        typeSelect.innerHTML = '<option value="">-- Select Submission Type --</option>';
        config.submission_types.forEach(t => {
            const opt = document.createElement('option');
            opt.value = t.code;
            opt.textContent = `${t.code} - ${t.name}`;
            typeSelect.appendChild(opt);
        });
    } catch(e) {
        console.error(e);
    }
}

// Load config on page load
window.onload = loadConfig;
</script>
</body>
</html>
